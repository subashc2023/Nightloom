<!doctype html>
<!-- Backlog 239: the real Sidebar with four chat rows, one per mark combination (none · draft · incognito ·
     incognito + draft), one of them also open in a background tab (which used to draw the ▭ glyph).
     Served by vite on a spare port and snapped with nightshift-code bin/snap (WebKit). -->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body { margin: 0; background: var(--paper, #111); }
      *, *::before, *::after { animation: none !important; }
      #root { position: relative; display: flex; flex-direction: column; width: 280px; height: 560px; }
      #cap { font: 12px/1.5 ui-monospace, monospace; color: #ddd; background: #000; padding: 6px 8px; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="cap"></div>
    <script>
      window.addEventListener("error", (e) => (document.getElementById("cap").textContent = "error: " + e.message));
      window.addEventListener("unhandledrejection", (e) => (document.getElementById("cap").textContent = "rejection: " + e.reason));
    </script>
    <script type="module" src="./sidebarmarks.ts"></script>
  </body>
</html>

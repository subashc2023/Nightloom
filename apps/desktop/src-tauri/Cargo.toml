[package]
name = "nightloom-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
nightloom-core.workspace = true
nightloom-service.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
# API keys entered in-app land in the OS credential store (Windows
# Credential Manager / macOS Keychain / Secret Service), never on disk.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }

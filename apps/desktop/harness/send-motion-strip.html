<!doctype html>
<!-- A board: the harness held at six instants, side by side (backlog 194). ?shape=a|b|c -->
<html><head><meta charset="UTF-8"><style>
  body { margin: 0; background: #111; color: #bbb; font: 12px/1.4 ui-monospace, monospace; }
  .grid { display: grid; grid-template-columns: repeat(3, 480px); gap: 6px; padding: 6px; }
  figure { margin: 0; } figcaption { padding: 2px 4px; }
  iframe { width: 480px; height: 360px; border: 0; display: block; }
</style></head><body><div class="grid" id="g"></div>
<script>
  const q = new URLSearchParams(location.search);
  const shape = q.get("shape") ?? "c";
  const times = (q.get("times") ?? "0,85,170,255,340,560").split(",");
  for (const t of times) {
    const f = document.createElement("figure");
    f.innerHTML = `<figcaption>${shape.toUpperCase()} · ${t} ms</figcaption><iframe src="send-motion.html?shape=${shape}&t=${t}${q.get("reduce") ? "&reduce=1" : ""}"></iframe>`;
    document.getElementById("g").appendChild(f);
  }
</script></body></html>

<!doctype html>
<!-- Item 289: the composer's controls row on the new-chat page (the real Welcome) and in a chat, snapped with
     nightshift-code bin/snap.  ?v=welcome|chat  &w=<pane css px>  &p=A..D  &text=1 (a draft, so the token
     estimate shows)  &busy=1 -->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body { margin: 0; background: var(--paper, #111); color: var(--ink); }
      *, *::before, *::after { animation: none !important; transition: none !important; }
      #root { position: relative; display: flex; flex-direction: column; height: 600px; overflow: hidden; }
      .main { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
      #cap { font: 11px/1.4 ui-monospace, monospace; color: #ddd; background: #000; padding: 4px 8px; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="cap"></div>
    <script>
      window.addEventListener("error", (e) => (document.getElementById("cap").textContent = "error: " + e.message));
      window.addEventListener("unhandledrejection", (e) => (document.getElementById("cap").textContent = "rejection: " + e.reason));
    </script>
    <script type="module" src="./row289.ts"></script>
  </body>
</html>

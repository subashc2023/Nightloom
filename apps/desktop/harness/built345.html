<!doctype html>
<!-- Item 345, the D2 panel as built: the real NoteView and NoteEditPanel, the Tauri bridge faked.
     ?state=empty|running|answered|proposal; ?measure=1 clicks a changed line and the expand control and prints
     what happened. Palette B (his). Snapped with nightshift-code bin/snap (WebKit). -->
<html lang="en" data-palette="B">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { margin: 0; }
      #root { position: relative; display: flex; flex-direction: column; width: 100vw; height: 100vh; }
      #cap { position: fixed; bottom: 0; left: 0; right: 0; z-index: 99999; font: 13px/1.5 ui-monospace, monospace; color: #fff; background: #000; padding: 6px 8px; white-space: pre-wrap; }
      #cap:empty { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="cap"></div>
    <script>
      window.addEventListener("error", (e) => (document.getElementById("cap").textContent = "error: " + e.message));
    </script>
    <script type="module" src="./built345.ts"></script>
  </body>
</html>

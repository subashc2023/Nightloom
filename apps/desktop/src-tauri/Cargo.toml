[package]
name = "nightloom-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
nightloom-core.workspace = true
nightloom-service.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
# API keys entered in-app land in the OS credential store (Windows
# Credential Manager / macOS Keychain / Secret Service), never on disk.
tauri-plugin-dialog = "2"
# The turn-end banner (nightshift backlog 079, blocker 106) is posted from
# Rust through the OS notification centre; the webview has no Notification
# API of its own, so this is the one way to reach it.
tauri-plugin-notification = "2"

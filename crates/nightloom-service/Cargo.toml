[package]
name = "nightloom-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nightloom-core.workspace = true
nightloom-providers.workspace = true
nightloom-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
tokio.workspace = true
tokio-util.workspace = true
thiserror.workspace = true
chrono.workspace = true
async-trait.workspace = true
regex.workspace = true
globset.workspace = true
walkdir.workspace = true
uuid.workspace = true
base64.workspace = true
reqwest.workspace = true
zip = { version = "8", default-features = false, features = ["deflate"] }
# The Nightshift watcher: one OS subscription per open contract root, so the
# GUI learns of a runner's status write without polling.
notify = "8"
keyring = { workspace = true, optional = true }
# The phone page's listener (nightshift backlog 091, Shape B). axum 0.8 is
# the version built on hyper 1 / http 1 / tower 0.5, which tauri and reqwest
# already compile — so it adds no second HTTP stack. The QR code that
# carries the token to the phone: `qrcode` with only its SVG renderer, which
# pulls in nothing (`image` is its optional dependency, left off).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
async-stream.workspace = true
# HTTPS on the phone listener from `tailscale cert`'s files (item 246 wave
# 3, blocker 660): the rustls reqwest already compiles, on its ring
# provider, so no second TLS stack and no aws-lc build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
# A WebSocket client for the voice socket's tests (`remote/voice_ws.rs`);
# the same version axum's `ws` feature already compiles.
tokio-tungstenite = "0.29"
# The roots for `voice_ws`'s by-hand test against a live HTTPS listener
# (wss://); the version reqwest's rustls already compiles.
webpki-roots = "1"

[features]
default = ["keyring"]
# The OS credential store. Optional so an embedder — or a build for a
# headless box with no D-Bus development headers — can drop the dependency;
# `credentials` still compiles, reads as "no stored key", and falls through
# to the environment.
keyring = ["dep:keyring"]

<!doctype html>
<!-- Item 322: the real Composer with app state stubbed, driven through synthetic input-method
     compositions, for nightshift-code bin/snap (WebKit). The caption says what each Enter did.
     ?f=0 the textarea, ?f=1 the formatted editor (LiveBox). -->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body { margin: 0; background: var(--paper, #111); }
      *, *::before, *::after { animation: none !important; transition: none !important; }
      #root { position: relative; display: flex; flex-direction: column; justify-content: flex-end; width: 900px; height: 360px; }
      #cap { font: 12px/1.5 ui-monospace, monospace; color: #ddd; background: #000; padding: 6px 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="cap"></div>
    <script>
      localStorage.removeItem("nightloom.drafts");
      // As main.rs sets it on the Mac window: the box's keys are ⌘, not Ctrl.
      window.__NIGHTLOOM_PLATFORM__ = "macos";
      window.addEventListener("error", (e) => (document.getElementById("cap").textContent += "\nerror: " + e.message));
      window.addEventListener("unhandledrejection", (e) => (document.getElementById("cap").textContent += "\nrejection: " + e.reason));
    </script>
    <script type="module" src="./ime322.ts"></script>
  </body>
</html>

[package]
name = "nightloom-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` (backlog 172, blocker 314): `Window::add_child`, the one way to
# put a web tab's page inside a pane, compiles only with it. It also makes the
# main page a child view that Tauri resizes with the window.
tauri = { version = "2", features = ["unstable"] }
nightloom-core.workspace = true
nightloom-service.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
# API keys entered in-app land in the OS credential store (Windows
# Credential Manager / macOS Keychain / Secret Service), never on disk.
tauri-plugin-dialog = "2"
# The turn-end banner (nightshift backlog 079, blocker 106) is posted from
# Rust through the OS notification centre; the webview has no Notification
# API of its own, so this is the one way to reach it.
tauri-plugin-notification = "2"
# The terminal pane (nightshift backlog 113, blocker 187): a pseudo-terminal
# for his login shell, read on a thread and streamed to xterm.js in the
# webview. `base64` carries the pty's bytes inside a JSON event — a string
# cannot hold a byte cut mid-character; `libc` reads the foreground process
# group for the strip's title. Both were already in the lockfile.
portable-pty = "0.9"
base64 = "0.22"
libc = "0.2"
# The Refresh-now banner (nightshift backlog 116, blocker 169) needs its
# click back, which the plugin's `show()` discards; this is the plugin's own
# macOS backend, already in the lockfile, held synchronously for that one
# banner. Nothing else posts through it.
[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = "4"

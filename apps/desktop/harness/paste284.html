<!doctype html>
<!-- Item 284: the real Composer (and, with ?s=transcript, the real Transcript) with app state stubbed and the
     Tauri bridge faked, driven by the page itself into each state of paste-as-attachment, for nightshift-code
     bin/snap (WebKit). The caption under the box says what the page did and what it measured. -->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body { margin: 0; background: var(--paper, #111); }
      *, *::before, *::after { animation: none !important; transition: none !important; }
      #root { position: relative; display: flex; flex-direction: column; justify-content: flex-end; width: 900px; height: 520px; }
      #cap { font: 12px/1.5 ui-monospace, monospace; color: #ddd; background: #000; padding: 6px 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="cap"></div>
    <script>
      // Before any module reads the drafts store: each state starts empty but `reloaded`.
      if (new URLSearchParams(location.search).get("s") !== "reloaded") localStorage.removeItem("nightloom.drafts");
      window.addEventListener("error", (e) => (document.getElementById("cap").textContent = "error: " + e.message));
      window.addEventListener("unhandledrejection", (e) => (document.getElementById("cap").textContent = "rejection: " + e.reason));
    </script>
    <script type="module" src="./paste284.ts"></script>
  </body>
</html>

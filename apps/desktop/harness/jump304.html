<!doctype html>
<!-- Backlog 304: the real App with a stubbed Tauri backend — a long chat scrolled up while a reply streams, the
     jump-to-latest button's speaking dots frozen at a set time, then hovered (focused), settled, clicked.
     Fixtures in jump304.ts.  ?step=speak|focus|done|click  &t=<ms into the throb>  &reduced=1  &p=A|B|C|D -->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      #cap { position: fixed; left: 0; top: 0; right: 0; font: 11px/1.4 ui-monospace, monospace; color: #ddd; background: #000c; padding: 4px 8px; white-space: pre-wrap; z-index: 999; }
    </style>
    <script>
      window.__NIGHTLOOM_PLATFORM__ = "macos";
      window.__TAURI_INTERNALS__ = {
        invoke: (cmd, args) => (window.__stub ? window.__stub(cmd, args) : Promise.reject("no stub")),
        transformCallback: () => 0,
        unregisterCallback: () => {},
        metadata: { currentWindow: { label: "main" }, currentWebview: { label: "main" } },
      };
      window.__TAURI_EVENT_PLUGIN_INTERNALS__ = { unregisterListener: () => {} };
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="cap"></div>
    <script>
      window.addEventListener("error", (e) => (document.getElementById("cap").textContent += "\nerror: " + e.message));
      window.addEventListener("unhandledrejection", (e) => (document.getElementById("cap").textContent += "\nrejection: " + e.reason));
    </script>
    <script type="module" src="./jump304.ts"></script>
  </body>
</html>

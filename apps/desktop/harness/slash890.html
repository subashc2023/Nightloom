<!doctype html>
<!-- Item 890: the real Composer, app state stubbed: #case=menu types "/ta" (the / menu with the table insert),
     #case=table then presses Enter (the 3×2 table as a grid, first cell focused); &layout=classic for Classic;
     &text=… for another token. For nightshift-code bin/snap (WebKit). -->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body { margin: 0; background: var(--paper, #111); }
      *, *::before, *::after { animation: none !important; transition: none !important; }
      #root { position: relative; display: flex; flex-direction: column; justify-content: flex-end; width: min(860px, 92vw); height: 420px; margin: 0 auto; }
      /* a closing (outroing, inert) menu: snap never ends its outro; the app removes it */
      .slash[inert] { display: none !important; }
      #cap { font: 12px/1.5 ui-monospace, monospace; color: #ddd; background: #000; padding: 6px 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="cap"></div>
    <script>
      localStorage.removeItem("nightloom.drafts");
      window.requestAnimationFrame = function (f) { return setTimeout(function () { f(performance.now()); }, 16); };
      window.cancelAnimationFrame = clearTimeout;
      window.addEventListener("error", (e) => (document.getElementById("cap").textContent = "error: " + e.message));
      window.addEventListener("unhandledrejection", (e) => (document.getElementById("cap").textContent = "rejection: " + e.reason));
    </script>
    <script type="module" src="./slash890.ts"></script>
  </body>
</html>

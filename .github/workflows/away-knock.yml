# Wakes Nightloom's away server 15 minutes before each job it keeps a copy of
# (nightshift item 781). Generated by `nightloom jobs-knock` from the Mac's job list on
# 2026-11-17; run it again after adding or re-timing a job. Times are UTC. Scheduled workflows
# run only from the default branch.
name: Wake the away server
on:
  schedule:
    - cron: "45 14,15 * * *"
  workflow_dispatch:
permissions: {}
jobs:
  knock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask for the phone page (no token; starts a stopped machine)
        run: curl -fsS -o /dev/null --max-time 120 --retry 3 --retry-delay 15 "https://nightloom-away-swaraag.fly.dev/?wake=job"

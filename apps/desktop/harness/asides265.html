<!doctype html>
<!-- Items 265, 266: the sidebar with a chat's asides and forks (?view=sidebar; &menu=1 opens the chat row menu),
     or the aside tab with its name and Close (?view=tab). Served by vite; snapped with nightshift-code bin/snap (WebKit). -->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body { margin: 0; background: var(--paper, #111); }
      /* An offscreen WKWebView runs no animations. */
      *, *::before, *::after { animation: none !important; }
      #root { position: relative; display: flex; flex-direction: column; width: var(--w, 960px); height: var(--h, 560px); }
      #cap { font: 12px/1.5 ui-monospace, monospace; color: #ddd; background: #000; padding: 6px 8px; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="cap"></div>
    <script>
      window.addEventListener("error", (e) => (document.getElementById("cap").textContent = "error: " + e.message));
      window.addEventListener("unhandledrejection", (e) => (document.getElementById("cap").textContent = "rejection: " + e.reason));
    </script>
    <script type="module" src="./asides265.ts"></script>
  </body>
</html>

<!doctype html>
<!-- Item 456: the typed-maths offer in the real Composer, app state stubbed, driven by the page itself
     (typedmath456.ts). The caption says what the page did and measured. #one | #many | #accepted | #denied |
     #fence | #perf, then @A..@D for the palette. For nightshift-code bin/snap (WebKit). -->
<html lang="en" data-palette="A">
  <head>
    <meta charset="UTF-8" />
    <style>
      body { margin: 0; background: var(--paper, #111); }
      #root { position: relative; display: flex; flex-direction: column; justify-content: flex-end; width: 820px; height: 300px; padding: 0 20px; }
      #cap { font: 12px/1.5 ui-monospace, monospace; color: #ddd; background: #000; padding: 6px 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="cap"></div>
    <script>
      try { localStorage.clear(); } catch {}
      window.__NIGHTLOOM_PLATFORM__ = "macos";
      window.addEventListener("error", (e) => (document.getElementById("cap").textContent += "\nerror: " + e.message));
      window.addEventListener("unhandledrejection", (e) => (document.getElementById("cap").textContent += "\nrejection: " + e.reason));
    </script>
    <script type="module" src="./typedmath456.ts"></script>
  </body>
</html>

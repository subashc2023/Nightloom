<!doctype html>
<!-- Backlog 283: an aside drawn with the chat's composer and message pieces, served by vite and snapped with
     nightshift-code bin/snap (WebKit).  ?v=card|panel|tab  &p=A|B|C|D (palette)  &asking=1 (the last answer still
     streaming)  &draft=1 (nothing asked yet)  &open=0 (the aside's chat is not the open one). -->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body { margin: 0; background: var(--paper, #111); color: var(--ink); }
      /* An offscreen WKWebView runs no animations. */
      *, *::before, *::after { animation: none !important; transition: none !important; }
      #root { position: relative; display: flex; width: 960px; height: 600px; overflow: hidden; }
      #cap { font: 11px/1.4 ui-monospace, monospace; color: #ddd; background: #000; padding: 4px 8px; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="cap"></div>
    <script>
      window.addEventListener("error", (e) => (document.getElementById("cap").textContent = "error: " + e.message));
      window.addEventListener("unhandledrejection", (e) => (document.getElementById("cap").textContent = "rejection: " + e.reason));
    </script>
    <script type="module" src="./aside283.ts"></script>
  </body>
</html>

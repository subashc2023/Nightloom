[package]
name = "nightloom-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nightloom-core.workspace = true
nightloom-providers.workspace = true
nightloom-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
tokio.workspace = true
tokio-util.workspace = true
thiserror.workspace = true
chrono.workspace = true
async-trait.workspace = true
regex.workspace = true
globset.workspace = true
walkdir.workspace = true
uuid.workspace = true
reqwest.workspace = true
zip = { version = "8", default-features = false, features = ["deflate"] }
keyring = { workspace = true, optional = true }

[features]
default = ["keyring"]
# The OS credential store. Optional so an embedder — or a build for a
# headless box with no D-Bus development headers — can drop the dependency;
# `credentials` still compiles, reads as "no stored key", and falls through
# to the environment.
keyring = ["dep:keyring"]

<!doctype html>
<!-- Item 819: an HTML file as a page. The real FileView (or NoteView, or the bare HtmlPage) over a mocked backend,
     served by vite on a spare port and snapped with nightshift-code bin/snap (WebKit).
     ?view=file|note|bare  &src=<url of the HTML to show, fetched by the harness; use a .txt copy — vite adds its client to an .html>  &name=<file name>  &source=1 (Source, not Page)
     &scheme=light|dark (bare only). The caption carries what the page could reach: a probe page posts
     {probe: "..."} lines, and the harness writes every one here, with the frame's load count. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta http-equiv="Content-Security-Policy" content="frame-src 'none'" />
    <style>
      body { margin: 0; background: var(--paper, #111); }
      *, *::before, *::after { animation: none !important; }
      #wrap { display: flex; height: calc(100vh - 120px); }
      #side { width: 260px; flex: none; background: var(--well); }
      #pane { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--sheet); }
      #cap { font: 12px/1.5 ui-monospace, monospace; color: #ddd; background: #000; padding: 6px 8px; white-space: pre-wrap; height: 108px; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="wrap"><div id="side"></div><section id="pane"></section></div>
    <div id="cap"></div>
    <script>
      window.addEventListener("error", (e) => (document.getElementById("cap").textContent += "error: " + e.message + "\n"));
      window.addEventListener("unhandledrejection", (e) => (document.getElementById("cap").textContent += "rejection: " + e.reason + "\n"));
    </script>
    <script type="module" src="./html819.ts"></script>
  </body>
</html>

<!doctype html>
<!-- Backlog 245: the real Transcript over a fixture log, served by vite on a spare port and snapped with
     nightshift-code bin/snap (WebKit). Four user messages: the first (its figure holds the system prompt,
     so the estimate shows), two with the log's exact figure (one worth a share bar), and the last with no
     reply yet (the estimate). -->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body { margin: 0; background: var(--paper, #111); }
      *, *::before, *::after { animation: none !important; transition: none !important; }
      #root { position: relative; display: flex; flex-direction: column; width: 960px; height: 900px; }
      #cap { font: 12px/1.5 ui-monospace, monospace; color: #ddd; background: #000; padding: 6px 8px; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="cap"></div>
    <script>
      window.addEventListener("error", (e) => (document.getElementById("cap").textContent = "error: " + e.message));
      window.addEventListener("unhandledrejection", (e) => (document.getElementById("cap").textContent = "rejection: " + e.reason));
    </script>
    <script type="module" src="./usertokens.ts"></script>
  </body>
</html>

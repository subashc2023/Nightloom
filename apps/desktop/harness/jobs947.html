<!doctype html>
<!-- Item 845 batch 3: the phone's Home page (HomeFirst with Home's stage) over a stubbed listener, for bin/snap shots.
     The query is read from window.__h9q: s=watch|brief|timeline|todo|triage|browse|run|research, classic=1,
     restart=1, away=1 (the away server answers: clicks are refused with its sentence). Not shipped. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Phone Jobs list — 947</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="cap" style="position:fixed;left:0;bottom:0;right:0;font:9px/1.3 ui-monospace,monospace;color:#ddd;background:#000c;padding:3px 6px;white-space:pre-wrap;z-index:99999;display:none"></div>
    <script>
      window.__capset = (m) => { const c = document.getElementById("cap"); c.style.display = "block"; c.textContent = m; };
      window.addEventListener("error", (e) => window.__capset("ERROR " + e.message));
      window.addEventListener("unhandledrejection", (e) => window.__capset("REJECT " + String(e.reason)));
    </script>
    <script type="module" src="./jobs947.ts"></script>
  </body>
</html>

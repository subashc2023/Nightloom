<!doctype html>
<!-- Item 820: a reply naming a matplotlib PNG, an SVG, an MP4 and a deleted picture (fixtures820/), snapped with
     nightshift-code bin/snap.  &p=A..D  &w=<pane css px>  &evil=1 (an SVG with a script in it; the caption says whether it ran)  &big=1 (the PNG opened full size) -->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body { margin: 0; background: var(--paper, #111); color: var(--ink); }
      *, *::before, *::after { animation: none !important; transition: none !important; }
      #root { padding: 20px 24px; box-sizing: border-box; }
      #cap { font: 11px/1.4 ui-monospace, monospace; color: #ddd; background: #000; padding: 4px 8px; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="cap"></div>
    <script>
      window.addEventListener("error", (e) => (document.getElementById("cap").textContent = "error: " + e.message));
      window.addEventListener("unhandledrejection", (e) => (document.getElementById("cap").textContent = "rejection: " + e.reason));
    </script>
    <script type="module" src="./reply820.ts"></script>
  </body>
</html>

<!doctype html>
<!--
  Item 338 — streaming-output animations to compare. Not a build entry: served by
  `npx vite --port 1441` from apps/desktop and opened in Safari (WebKit, the engine
  Nightloom's window uses). The real AssistantMessage, fed one recorded-shape turn;
  the treatments are a layer on top (stream338-motion.ts), the component unchanged.
    ?text=fade&think=unfurl&tool=weft   start on these
    ?compare=text|think|tool            side by side, one column per option
    ?reply=long                         the ~5,000-word reply
    ?speed=0.5                          replay speed
    ?reduce=1                           as under prefers-reduced-motion
    ?open=1                             calls expanded (the transcript's Tools toggle on)
    ?measure=<text treatment>           one long run; result on window.__result
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <title>Streaming output — animations to compare</title>
    <style>
      html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans, system-ui); }
      header { position: sticky; top: 0; z-index: 10; background: var(--paper); border-bottom: 1px solid var(--line); padding: 10px 16px;
        display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; }
      header h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 600; }
      header label { display: inline-flex; gap: 6px; align-items: center; color: var(--dim); }
      header select, header button { font: inherit; color: var(--ink); background: var(--sheet); border: 1px solid var(--line2); border-radius: 6px; padding: 3px 8px; }
      header button { cursor: pointer; }
      header button:hover { border-color: var(--accent); }
      #status { font: 11px var(--mono, monospace); color: var(--dim); flex-basis: 100%; }
      #stage { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 12px; padding: 12px 16px; }
      #stage.single { grid-template-columns: minmax(0, 820px); justify-content: center; }
      .col { display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
      .col-head { padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--dim); line-height: 1.45; min-height: 3.6em; }
      .col-head p { margin: 0 0 3px; }
      .col-head b { color: var(--ink); font-weight: 600; }
      .vp { height: 72vh; overflow-y: auto; }
      #stage:not(.single) .vp { height: 64vh; }
      .inner { padding: 16px 18px 40px; display: flex; flex-direction: column; gap: 14px; }
      .user-turn { display: flex; justify-content: flex-end; }
      .user-bubble { background: color-mix(in srgb, var(--sheet) 88%, var(--ink)); border-radius: 18px; padding: 10px 16px; max-width: 75%; font-size: 15px; line-height: 1.5; }
      .reply-root { position: relative; }
      #numbers { padding: 4px 16px 32px; font-size: 13px; }
      #numbers h3 { font-size: 13px; margin: 18px 0 4px; }
      #numbers .note { color: var(--dim); margin: 0 0 6px; max-width: 900px; }
      #numbers table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
      #numbers th, #numbers td { border-bottom: 1px solid var(--line); padding: 4px 10px; text-align: right; }
      #numbers th:first-child, #numbers td:first-child { text-align: left; }
      #numbers th { color: var(--dim); font-weight: 500; }
    </style>
  </head>
  <body>
    <header>
      <h1>Streaming output — animations to compare</h1>
      <label>Text <select id="text"></select></label>
      <label>Thinking <select id="think"></select></label>
      <label>Tools <select id="tool"></select></label>
      <label>Side by side
        <select id="compare">
          <option value="none">off</option>
          <option value="text">every text option</option>
          <option value="think">every thinking option</option>
          <option value="tool">every tools option</option>
        </select>
      </label>
      <label>Reply
        <select id="reply">
          <option value="short">short (~250 words)</option>
          <option value="long">long (~5,000 words)</option>
        </select>
      </label>
      <label>Speed
        <select id="speed">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
      </label>
      <button id="replay">Replay</button>
      <label title="The transcript's own Tools toggle: each call drawn with its input and result, or one line"><input type="checkbox" id="open" /> calls expanded</label>
      <label><input type="checkbox" id="reduce" /> reduced motion</label>
      <button id="measure" title="Runs the long reply through each text option and measures frames (about 5 minutes)">Measure frames here</button>
      <div id="status"></div>
    </header>
    <main id="stage"></main>
    <section id="numbers"></section>
    <script type="module" src="./stream338.svelte.ts"></script>
  </body>
</html>

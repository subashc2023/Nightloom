<!doctype html>
<!-- Backlogs 237, 238: the real AsideView (an aside as a tab), served by vite on a spare port and snapped with
     nightshift-code bin/snap (WebKit).  ?turns=<n> answered exchanges  &asking=1 (the last one still streaming)
     &draft=1 (nothing asked yet)  &open=0 (the tab's chat is not the open one)  &unsent=<text>
     &scroll=<px>&mode=remount|switch (237: scroll, then unmount and mount again / switch chats and back). -->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body { margin: 0; background: var(--paper, #111); }
      /* An offscreen WKWebView runs no animations. */
      *, *::before, *::after { animation: none !important; }
      #root { position: relative; display: flex; flex-direction: column; width: 960px; height: 560px; }
      #cap { font: 12px/1.5 ui-monospace, monospace; color: #ddd; background: #000; padding: 6px 8px; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="cap"></div>
    <script>
      window.addEventListener("error", (e) => (document.getElementById("cap").textContent = "error: " + e.message));
      window.addEventListener("unhandledrejection", (e) => (document.getElementById("cap").textContent = "rejection: " + e.reason));
    </script>
    <script type="module" src="./asidetab.ts"></script>
  </body>
</html>

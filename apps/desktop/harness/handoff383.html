<!doctype html>
<!-- Backlog 383 (review 2026-10-18): the real Composer with the hand-off state set by the page. ?s=due|wrapped
     (Minimize clicked, the card folded) or ?s=stayed (Stay here clicked on the wrapped card: the Hand off button).
     The box is the window less a 260 px sidebar. Snapped with nightshift-code bin/snap (WebKit) at 1440 and 700;
     the caption carries the measurement. -->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body { margin: 0; background: var(--paper, #111); display: flex; }
      *, *::before, *::after { animation: none !important; transition: none !important; }
      #side { width: 260px; flex: none; height: 100vh; background: var(--well); }
      #col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      #root { position: relative; display: flex; flex-direction: column; justify-content: flex-end; height: 440px; }
      #cap { font: 12px/1.5 ui-monospace, monospace; color: #ddd; background: #000; padding: 6px 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="side"></div>
    <div id="col"><div id="root"></div><div id="cap"></div></div>
    <script>
      localStorage.removeItem("nightloom.drafts");
      window.addEventListener("error", (e) => (document.getElementById("cap").textContent = "error: " + e.message));
      window.addEventListener("unhandledrejection", (e) => (document.getElementById("cap").textContent = "rejection: " + e.reason));
    </script>
    <script type="module" src="./handoff383.ts"></script>
  </body>
</html>

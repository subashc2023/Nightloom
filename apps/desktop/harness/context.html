<!doctype html>
<!-- Backlog 242: the real ContextPanel (the Context page) with its find bar, served by vite on a spare port and
     snapped with nightshift-code bin/snap (WebKit). The Tauri backend is a stub below.
     ?mode=layers|sent|session  &q=<query> (typed into the bar after ⌘F)  &steps=<n> (⏎ n times)  &back=1 (⇧⏎ once)
     &esc=<n> (⎋ n times at the end)  &open=<fold key> (a layer he opened by hand first) -->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body { margin: 0; background: #000; }
      *, *::before, *::after { animation: none !important; transition: none !important; }
      #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.45); }
      #cap { position: fixed; left: 0; right: 0; bottom: 0; font: 11px/1.4 ui-monospace, monospace; color: #ddd; background: #000c; padding: 4px 8px; white-space: pre-wrap; z-index: 99; }
    </style>
    <script>
      window.__NIGHTLOOM_PLATFORM__ = "macos";
      // The backend, stubbed: filled in by context.ts before the panel mounts.
      window.__TAURI_INTERNALS__ = {
        invoke: (cmd, args) => (window.__stub ? window.__stub(cmd, args) : Promise.reject("no stub")),
        transformCallback: () => 0,
        metadata: { currentWindow: { label: "main" }, currentWebview: { label: "main" } },
      };
    </script>
  </head>
  <body>
    <div id="overlay"></div>
    <div id="cap"></div>
    <script>
      window.addEventListener("error", (e) => (document.getElementById("cap").textContent = "error: " + e.message));
      window.addEventListener("unhandledrejection", (e) => (document.getElementById("cap").textContent += "\nrejection: " + e.reason));
    </script>
    <script type="module" src="./context.ts"></script>
  </body>
</html>

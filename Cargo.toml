[workspace]
resolver = "2"
members = [
    "crates/nightloom-core",
    "crates/nightloom-providers",
    "crates/nightloom-service",
    "crates/nightloom-evals",
    "crates/nightloom-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
nightloom-core = { path = "crates/nightloom-core" }
nightloom-providers = { path = "crates/nightloom-providers" }
nightloom-service = { path = "crates/nightloom-service" }
nightloom-evals = { path = "crates/nightloom-evals" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
clap = { version = "4", features = ["derive"] }

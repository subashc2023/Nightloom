<!doctype html>
<!-- Item 360: the zoom audit's gallery — before | after for every surface at 90 / 100 / 110 / 125 %, at the
     1440 × 900 window and the narrowest one the app allows (700 × 500), and the phone page at 390 × 844.
     The shots live in the notes repo (nightshift-code notes/runner-design/360-shots/{before,after}/); open this
     file straight from disk, or pass ?shots=<folder URL>. #<surface>-<window> opens one surface. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zoom audit 360</title>
    <style>
      :root { --bg: #15171b; --card: #1d2026; --ink: #e6e3dc; --dim: #8b8d93; --line: #30333a; --acc: #e0a458; --fix: #7cc48a; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, "IBM Plex Sans", sans-serif; }
      header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px; }
      h1 { font-size: 17px; margin: 0 0 8px; }
      .bar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
      button { font: inherit; font-size: 13px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; cursor: pointer; }
      button.on { border-color: var(--acc); color: var(--acc); }
      main { padding: 12px 16px 40px; }
      .note { color: var(--dim); max-width: 1100px; margin: 4px 0 14px; }
      .note b { color: var(--ink); font-weight: 600; }
      .row { margin: 0 0 22px; }
      .row h2 { font-size: 14px; margin: 0 0 6px; color: var(--dim); font-weight: 500; }
      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .pair.phone { grid-template-columns: repeat(2, minmax(0, 340px)); }
      figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
      figcaption { font-size: 12px; padding: 4px 8px; color: var(--dim); }
      figcaption.after { color: var(--fix); }
      img { display: block; width: 100%; height: auto; cursor: zoom-in; }
      img.big { position: fixed; inset: 0; margin: auto; width: auto; max-width: 100vw; max-height: 100vh; z-index: 9; cursor: zoom-out; box-shadow: 0 0 0 100vmax #000d; }
      @media (max-width: 700px) { .pair { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>
      <h1>Zoom audit (item 360): before | after</h1>
      <div class="bar" id="surfaces"></div>
      <div class="bar" id="windows"></div>
    </header>
    <main>
      <p class="note" id="note"></p>
      <div id="rows"></div>
    </main>
    <script>
      const q = new URLSearchParams(location.search);
      const BASE = (q.get("shots") ||
        "file:///Users/swaraagsistla/Documents/ComputerScience/PersonalProjects/Nightloom/nightshift-code/notes/runner-design/360-shots").replace(/\/$/, "");
      const ZOOMS = [90, 100, 110, 125];
      const SURFACES = {
        chat: "The chat: transcript, minimap (the navigator), composer, top bar, sidebar.",
        welcome: "The new-chat page.",
        approve: "An approval card (Bash). <b>Fixed:</b> its key hint wraps inside the card (it ran past the border at 700 / 125 %).",
        ask: "A question card (AskUserQuestion).",
        playwright: "Playwright's approval card. <b>Fixed:</b> its key hint wraps inside the card.",
        aside: "Aside cards in the chat.",
        asidepanel: "The aside side panel. <b>Fixed:</b> the card head's “Aside of …” (drawn as “A…”) gives its room to the chips; the panel's title row says it.",
        notes: "The sidebar's Notes tab over the new-chat page (the note chips sit at the ring's start: animations are frozen).",
        note: "The note editor.",
        bell: "The bell's card.",
        settings: "Settings.",
        rail: "The model rail. Unconfirmed: the composer's foot chips draw over the rail's bottom here; a hit-test says the rail is on top (likely the offscreen snapshot).",
        context: "The Context page (the harness has no context to show: “Not connected.”).",
        drop: "The drop overlay (item 362).",
        phonecard: "The phone page with an approval card (Safari's page zoom = the same page zoom).",
        phoneidle: "The phone page, a chat.",
      };
      const COMMON =
        "<b>Fixed everywhere:</b> the sidebar is drawn at most 34 % of the window, so at 700 points and 110–125 % the chat keeps its room (top bar on one row, cards not cut); separators keep their spaces (“s3 · chat”, “Chat · subscription”); the Search chats field is inset. " +
        "<b>Not applied (Composer.svelte held by item 374):</b> the scrollbar thumb in the empty composer at 90 % — patch in 360-report.md.";
      let surface = (location.hash.slice(1).split("-")[0]) || "chat";
      let win = location.hash.slice(1).split("-")[1] || "1440";
      const isPhone = (s) => s.startsWith("phone");
      function draw() {
        if (isPhone(surface)) win = "390";
        else if (win === "390") win = "1440";
        history.replaceState(null, "", "#" + surface + "-" + win + location.search);
        document.getElementById("surfaces").innerHTML = Object.keys(SURFACES)
          .map((s) => `<button class="${s === surface ? "on" : ""}" data-s="${s}">${s}</button>`).join("");
        document.getElementById("windows").innerHTML = isPhone(surface)
          ? `<button class="on">390 × 844</button>`
          : ["1440", "700"].map((w) => `<button class="${w === win ? "on" : ""}" data-w="${w}">${w === "1440" ? "1440 × 900" : "700 × 500 (narrowest)"}</button>`).join("");
        document.getElementById("note").innerHTML = SURFACES[surface] + " " + COMMON;
        document.getElementById("rows").innerHTML = ZOOMS.map((z) => {
          const f = `${surface}-${win}-${z}.jpg`;
          return `<div class="row"><h2>${z} %</h2><div class="pair${isPhone(surface) ? " phone" : ""}">
            <figure><figcaption>before</figcaption><img loading="lazy" src="${BASE}/before/${f}" alt="before, ${surface} at ${z} %"></figure>
            <figure><figcaption class="after">after</figcaption><img loading="lazy" src="${BASE}/after/${f}" alt="after, ${surface} at ${z} %"></figure>
          </div></div>`;
        }).join("");
      }
      document.addEventListener("click", (e) => {
        const t = e.target;
        if (t.dataset && t.dataset.s) { surface = t.dataset.s; draw(); }
        else if (t.dataset && t.dataset.w) { win = t.dataset.w; draw(); }
        else if (t.tagName === "IMG") t.classList.toggle("big");
      });
      draw();
    </script>
  </body>
</html>

<!doctype html>
<!-- Item 968 (review, 2026-11-25): the phone's Nightshift project list (NightshiftSheet) over a stubbed listener, for
     bin/snap: each project's badge counts its held blockers, an older service's row (no held_blockers) its open ones.
     The query is read from window.__h9q: classic=1. Not shipped. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nightshift on the phone — 968</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="cap" style="position:fixed;left:0;bottom:0;right:0;font:9px/1.3 ui-monospace,monospace;color:#ddd;background:#000c;padding:3px 6px;white-space:pre-wrap;z-index:99999"></div>
    <script>
      window.addEventListener("error", (e) => (document.getElementById("cap").textContent += "\nERROR " + e.message));
      window.addEventListener("unhandledrejection", (e) => (document.getElementById("cap").textContent += "\nREJECT " + String(e.reason)));
    </script>
    <script type="module" src="./phone968.ts"></script>
  </body>
</html>

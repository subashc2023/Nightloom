<!doctype html>
<!-- Review of 315: probes of the real Composer (see review315.ts).
     bridge faked and recording what Send hands the backend, driven by the page into each state of a code paste,
     for nightshift-code bin/snap (WebKit). ?pal= sets the palette. The caption says what it measured. -->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body { margin: 0; background: var(--paper, #111); }
      *, *::before, *::after { animation: none !important; transition: none !important; }
      #root { position: relative; display: flex; flex-direction: column; justify-content: flex-end; width: 900px; height: 600px; }
      #cap { font: 12px/1.5 ui-monospace, monospace; color: #ddd; background: #000; padding: 6px 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="cap"></div>
    <script>
      // Before any module reads the drafts store: each state starts empty but `reloaded`.
      localStorage.removeItem("nightloom.drafts");
      const pal = new URLSearchParams(location.search).get("pal");
      if (pal) document.documentElement.dataset.palette = pal;
      window.addEventListener("error", (e) => (document.getElementById("cap").textContent = "error: " + e.message));
      window.addEventListener("unhandledrejection", (e) => (document.getElementById("cap").textContent = "rejection: " + e.reason));
    </script>
    <script type="module" src="./review315.ts"></script>
  </body>
</html>

<!doctype html>
<!-- Item 885: a Notes image (NoteMedia) zoomed in its pane, and its zoom kept past leaving, snapped with nightshift-code bin/snap.
     &click=corner (a click on the picture near its top-left corner, i.e. zoomed there)  &click=outside (a click beside it: closed)
     &click=twice (corner, then again: back to fit)  &pinch=1 (a ctrl-wheel pinch in at the centre) -->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body { margin: 0; background: var(--paper, #111); color: var(--ink); }
      *, *::before, *::after { animation: none !important; transition: none !important; }
      #root { padding: 20px 24px; box-sizing: border-box; }
      #cap { position: fixed; left: 0; top: 0; z-index: 2000; font: 11px/1.4 ui-monospace, monospace; color: #ddd; background: #000; padding: 4px 8px; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="cap"></div>
    <script>
      window.addEventListener("error", (e) => (document.getElementById("cap").textContent = "error: " + e.message));
    </script>
    <script type="module" src="./note885.ts"></script>
  </body>
</html>

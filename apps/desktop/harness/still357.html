<!doctype html>
<!-- Backlog 357: the still-running line in three states (running with Stop, done, stopped) under a reply,
     served by vite and snapped with nightshift-code bin/snap (WebKit).  &panel=1 (the Running-tasks panel opened on a name). -->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body { margin: 0; background: var(--paper, #111); color: var(--ink); }
      /* An offscreen WKWebView runs no animations. */
      *, *::before, *::after { animation: none !important; transition: none !important; }
      #root { position: relative; display: flex; width: 100vw; height: calc(100vh - 44px); overflow: hidden; }
      #cap { font: 11px/1.4 ui-monospace, monospace; color: #ddd; background: #000; padding: 4px 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="cap"></div>
    <script>
      window.addEventListener("error", (e) => (document.getElementById("cap").textContent = "error: " + e.message));
      window.addEventListener("unhandledrejection", (e) => (document.getElementById("cap").textContent = "rejection: " + e.reason));
    </script>
    <script type="module" src="./still357.ts"></script>
  </body>
</html>

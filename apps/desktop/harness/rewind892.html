<!doctype html>
<!-- Item 892: the real Composer after the real rewindTo of a message sent with two passage comments
     (Tauri stubbed), for nightshift-code bin/snap. #case=empty (box empty) or kept (his draft in the box). -->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body { margin: 0; background: var(--paper, #111); }
      *, *::before, *::after { animation: none !important; transition: none !important; }
      #root { position: relative; display: flex; flex-direction: column; justify-content: flex-end; width: 900px; height: 340px; }
      #cap { font: 12px/1.5 ui-monospace, monospace; color: #ddd; background: #000; padding: 6px 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="cap"></div>
    <script>
      localStorage.removeItem("nightloom.drafts"); localStorage.removeItem("nightloom.sentComments.v1");
      window.addEventListener("error", (e) => (document.getElementById("cap").textContent = "error: " + e.message));
      window.addEventListener("unhandledrejection", (e) => (document.getElementById("cap").textContent = "rejection: " + e.reason));
    </script>
    <script type="module" src="./rewind892.ts"></script>
  </body>
</html>

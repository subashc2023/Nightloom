<!doctype html>
<!-- Item 770: pages inside a reply. The real AssistantMessage (Jarvis) or AssistantMessageClassic drawing a reply
     whose ```html page blocks become sandboxed pages, with the kit loaded by name from the bundle. Served by vite
     on a spare port (`npx vite --port 14770 --strictPort`, from apps/desktop) and snapped with nightshift-code
     bin/snap (WebKit).
     #case=vega|mermaid|katex|three|table|error|all|many  (fixtures770/*.md; all = vega+mermaid+katex)
     &layout=classic   &collapsed=1 (the setting)   &source=1 (first page as Source)   &stream=N (the first N
     characters, as a streaming reply)   &phone=1 (the phone's renderer in a 390 px column, light with &scheme=light)
     The caption lists what each page posted about itself ({probe}) and what the harness measured. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta http-equiv="Content-Security-Policy" content="frame-src 'none'" />
    <style>
      body { margin: 0; background: var(--paper, #111); color: var(--ink); }
      *, *::before, *::after { animation: none !important; transition: none !important; }
      #root { position: relative; width: 860px; margin: 0 auto; padding: 24px; box-sizing: border-box; }
      #root.phone { width: 390px; padding: 12px; font-size: 16px; }
      #cap { font: 11px/1.5 ui-monospace, monospace; color: #ddd; background: #000; padding: 6px 10px; white-space: pre-wrap; }
    </style>
    <script>
      window.__NIGHTLOOM_PLATFORM__ = "macos";
      try { localStorage.clear(); } catch {}
      if (/(^|[#&])layout=classic/.test(location.hash)) { try { localStorage.setItem("nightloom.layout", "classic"); } catch {} document.documentElement.dataset.layout = "classic"; document.documentElement.dataset.palette = "classic-A"; }
      if (/(^|[#&])collapsed=1/.test(location.hash)) { try { localStorage.setItem("nightloom.replyPages.collapsed", "1"); } catch {} }
      window.__TAURI_INTERNALS__ = { invoke: () => Promise.resolve(null), transformCallback: () => 0, unregisterCallback: () => {}, metadata: { currentWindow: { label: "main" }, currentWebview: { label: "main" } } };
      window.__TAURI_EVENT_PLUGIN_INTERNALS__ = { unregisterListener: () => {} };
      window.addEventListener("error", (e) => (document.getElementById("cap").textContent += "\nerror: " + e.message));
      window.addEventListener("unhandledrejection", (e) => (document.getElementById("cap").textContent += "\nrejection: " + e.reason));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="cap"></div>
    <script type="module" src="./page770.ts"></script>
  </body>
</html>
